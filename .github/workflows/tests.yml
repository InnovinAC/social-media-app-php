name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    name: Framework / PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Syntax check
        run: |
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          node --check resources/js/phpvin.js

      - run: ./vendor/bin/phpunit

  quality:
    runs-on: ubuntu-latest
    name: Framework / static analysis and style

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Code style
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1

  minimal-install:
    runs-on: ubuntu-latest
    name: Framework / no optional dependencies

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite
          coverage: none

      # The core must work with neither Twig nor dotenv present.
      - run: composer install --no-dev --prefer-dist --no-interaction --no-progress
      - run: php tests/smoke/api-only.php

  package:
    runs-on: ubuntu-latest
    name: Package / installs as a dependency

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite
          coverage: none

      - name: Validate both manifests
        run: |
          composer validate --strict --no-check-all
          cd skeleton && composer validate --no-check-publish

      # Builds the distributable, installs it copied (not symlinked) into a
      # throwaway app, and boots it. Catches anything that only works because
      # the framework source happens to sit next door.
      - name: Install and boot as a real dependency
        run: bin/package-check

  skeleton:
    runs-on: ubuntu-latest
    name: Skeleton / boots against the local framework

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite
          coverage: none

      - name: Install the skeleton
        working-directory: skeleton
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env

      - name: Migrate and smoke test
        working-directory: skeleton
        run: |
          php database/migrate.php
          php -S localhost:8000 -t public &
          sleep 2
          curl -sf http://localhost:8000/ > /dev/null
          curl -sf http://localhost:8000/api/health | grep -q '"status":"ok"'
          curl -sf http://localhost:8000/_phpvin/phpvin.js > /dev/null
